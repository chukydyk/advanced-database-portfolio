# =====================================================================
# Portfolio 5 | postgresql_replication_example.conf
# DESIGN EXAMPLE ONLY. These settings were NOT executed for this portfolio.
# They show how PostgreSQL streaming replication would be configured for
# The Homes booking database (the system of record for money and reservations).
# =====================================================================

# ---- On the PRIMARY (postgresql.conf) -------------------------------
wal_level = replica                       # write enough information for replicas
max_wal_senders = 10                      # connections that stream WAL to standbys
wal_keep_size = 1GB                       # keep WAL for a standby that falls behind
synchronous_commit = on                   # COMMIT waits for the synchronous standby
synchronous_standby_names = 'FIRST 1 (standby_zone_b)'   # one standby must confirm every commit
archive_mode = on                         # ship WAL to backup storage for point-in-time recovery
archive_command = 'cp %p /backup/wal/%f'  # replace with your cloud storage tool

# ---- On the PRIMARY (pg_hba.conf): allow the standby to replicate ---
# host  replication  replicator  10.0.2.0/24  scram-sha-256

# ---- Create the standby (run on the standby server) ------------------
# pg_basebackup -h primary.example -U replicator -D /var/lib/postgresql/data -R -X stream

# ---- On the STANDBY (postgresql.conf / postgresql.auto.conf) ---------
hot_standby = on                          # allow read-only queries while replicating
primary_conninfo = 'host=primary.example user=replicator application_name=standby_zone_b'

# ---- Checks ----------------------------------------------------------
# On the primary:  SELECT application_name, state, sync_state, replay_lag FROM pg_stat_replication;
# On a standby:    SELECT pg_is_in_recovery(), now() - pg_last_xact_replay_timestamp() AS replay_delay;

# ---- Trade-off in one line -------------------------------------------
# synchronous_standby_names set   -> no committed booking is lost if the primary dies, but every COMMIT
#                                    waits for the standby (higher latency; writes pause if the standby is down).
# synchronous_standby_names empty -> faster commits, but a failover can lose the last few transactions.
